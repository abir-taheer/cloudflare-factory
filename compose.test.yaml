# Runtime-image blackbox topology: host and Docker browsers use identical localhost URLs.
services:
  mailpit:
    ports: !reset []
  api:
    build: { context: ., target: api }
    image: factory-api:local
    command: !reset null
    volumes: !reset []
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    environment:
      FRONTEND_ORIGINS: http://localhost:${FRONTEND_PORT:-5174}
    ports: !override
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:${FRONTEND_PORT:-5174}:${FRONTEND_PORT:-5174}"
    healthcheck:
      test:
        [
          CMD,
          /nodejs/bin/node,
          -e,
          "fetch('http://localhost:8787/readyz').then(r=>process.exit(r.ok?0:1))",
        ]
  frontend:
    build: { context: ., target: frontend }
    image: factory-frontend:local
    command: !reset null
    volumes: !reset []
    ports: !reset []
    network_mode: service:api
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    environment:
      API_URL: http://localhost:8787
      PORT: "${FRONTEND_PORT:-5174}"
    healthcheck:
      test:
        [
          CMD,
          /nodejs/bin/node,
          -e,
          "fetch('http://localhost:'+process.env.PORT+'/').then(r=>process.exit(r.ok?0:1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
  workflows:
    build: { context: ., target: workflows }
    image: factory-workflows:local
    command: !reset null
    volumes: !reset []
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
  browser-tests:
    network_mode: service:api
    depends_on:
      frontend: { condition: service_healthy }
      workflows: { condition: service_started }
    environment:
      BASE_URL: http://localhost:${FRONTEND_PORT:-5174}
      API_URL: http://localhost:8787
      MAILPIT_URL: http://mailpit:8025
