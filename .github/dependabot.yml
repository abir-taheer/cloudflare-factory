version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      effect:
        patterns: [effect, "@effect/*"]
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Match the Node 24 runtime and the parser/generator's supported TS APIs.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
        versions: [">=6.1.0"]
      # The current rule harness and React Doctor require ESLint's eslintrc API.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Upgrade the Node runtime, types and native worker dependencies together.
      - dependency-name: node
        update-types: [version-update:semver-major]
