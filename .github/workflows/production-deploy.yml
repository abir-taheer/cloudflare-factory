name: Production deploy
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy and verify; all bootstraps the dependency-ordered stack
        required: true
        type: choice
        options: [api, frontend, workflows, all]
      allow_create:
        description: Explicitly permit first creation of owned production compute/database resources
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: cloudflare-production-lifecycle
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOYMENT_APP: ${{ inputs.app }}
      REVISION: ${{ github.sha }}
      REPOSITORY_ID: ${{ github.repository_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Start disposable portable dependencies
        run: docker compose up --build --wait --wait-timeout 240
      - name: Check controller and test selected applications without deployment credentials
        run: |
          docker compose run --rm --no-deps -e DEPLOYMENT_APP tools sh -ec '
            npx oxlint --type-aware --type-check --deny-warnings scripts
            node --import tsx --test scripts/production/*.test.ts
            case "$DEPLOYMENT_APP" in
              all) for app in workflows api frontend; do npm run test --workspace "@factory/$app"; done ;;
              api|frontend|workflows) npm run test --workspace "@factory/$DEPLOYMENT_APP" ;;
              *) exit 1 ;;
            esac
          '
      - name: Build selected Worker artifacts without secrets
        run: >-
          docker compose run --rm --no-deps -e DEPLOYMENT_APP -e REVISION -e REPOSITORY_ID
          tools node --import tsx scripts/build/production-artifacts-cli.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-bundle
          path: production-artifact/
          if-no-files-found: error
          retention-days: 2
      - name: Remove disposable infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-prod
    env:
      DEPLOYMENT_ENVIRONMENT: cloudflare-prod
      DEPLOYMENT_APP: ${{ inputs.app }}
      ALLOW_CREATE: ${{ inputs.allow_create && 'true' || 'false' }}
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_ID: ${{ github.repository_id }}
      REVISION: ${{ github.sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_NAME: ${{ vars.CLOUDFLARE_ACCOUNT_NAME }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_PARENT_BRANCH_ID: ${{ vars.NEON_PARENT_BRANCH_ID }}
      DOPPLER_DEPLOY_PROJECT: ${{ vars.DOPPLER_DEPLOY_PROJECT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Install only trusted main tooling before any secret is passed to a process.
      - name: Build trusted production controller
        run: docker compose build tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-bundle
          path: production-artifact
      - name: Provision or recover the persistent production database
        if: inputs.app != 'frontend'
        id: database
        uses: ./.github/actions/provision-preview-database
        with:
          mode: prod
          output-file: ${{ runner.temp }}/production-database/handoff.json
        env:
          DOPPLER_DEPLOY_TOKEN: ${{ secrets.DOPPLER_DEPLOY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy selected app and verify production behavior
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOPPLER_DEPLOY_TOKEN: ${{ secrets.DOPPLER_DEPLOY_TOKEN }}
          DOPPLER_API_TOKEN: ${{ (inputs.app == 'api' || inputs.app == 'all') && secrets.DOPPLER_API_TOKEN || '' }}
          DOPPLER_API_PROJECT: ${{ vars.DOPPLER_API_PROJECT }}
          DOPPLER_FRONTEND_TOKEN: ${{ (inputs.app == 'frontend' || inputs.app == 'all') && secrets.DOPPLER_FRONTEND_TOKEN || '' }}
          DOPPLER_FRONTEND_PROJECT: ${{ vars.DOPPLER_FRONTEND_PROJECT }}
          DOPPLER_WORKFLOWS_TOKEN: ${{ (inputs.app == 'workflows' || inputs.app == 'all') && secrets.DOPPLER_WORKFLOWS_TOKEN || '' }}
          DOPPLER_WORKFLOWS_PROJECT: ${{ vars.DOPPLER_WORKFLOWS_PROJECT }}
        run: |
          mkdir -p "$RUNNER_TEMP/production-database"
          docker compose run --rm --no-deps \
            --volume "$RUNNER_TEMP/production-database:/database-output:ro" \
            -e DATABASE_OUTPUT_FILE=/database-output/handoff.json \
            -e GITHUB_ACTIONS -e GITHUB_EVENT_NAME -e GITHUB_REF -e GITHUB_TOKEN \
            -e DEPLOYMENT_ENVIRONMENT -e DEPLOYMENT_APP -e ALLOW_CREATE \
            -e REPOSITORY -e REPOSITORY_ID -e REVISION \
            -e CLOUDFLARE_ACCOUNT_ID -e CLOUDFLARE_ACCOUNT_NAME \
            -e DOPPLER_DEPLOY_TOKEN -e DOPPLER_DEPLOY_PROJECT \
            -e DOPPLER_API_TOKEN -e DOPPLER_API_PROJECT \
            -e DOPPLER_FRONTEND_TOKEN -e DOPPLER_FRONTEND_PROJECT \
            -e DOPPLER_WORKFLOWS_TOKEN -e DOPPLER_WORKFLOWS_PROJECT \
            tools node --import tsx scripts/production/production-deploy-cli.ts
      - name: Remove private database handoff
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/production-database"
