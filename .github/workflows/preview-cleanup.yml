name: Preview cleanup
on:
  workflow_run:
    workflows: [Preview cleanup request]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Internal PR preview to destroy
        required: true
        type: number
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: cloudflare-preview-lifecycle
  cancel-in-progress: false
jobs:
  cleanup:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-preview
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: docker compose build tools
      - name: Destroy owned resources and verify absence
        env:
          DOPPLER_DEPLOY_TOKEN: ${{ secrets.DOPPLER_DEPLOY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: 'true'
          PREVIEW_ENVIRONMENT: cloudflare-preview
          PREVIEW_RUN_ID: ${{ github.event.workflow_run.id }}
          PREVIEW_PR: ${{ inputs.pr }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_NAME: ${{ vars.CLOUDFLARE_ACCOUNT_NAME }}
          DOPPLER_DEPLOY_PROJECT: ${{ vars.DOPPLER_DEPLOY_PROJECT }}
        run: >-
          docker compose run --rm --no-deps
          -e DOPPLER_DEPLOY_TOKEN -e GITHUB_TOKEN -e GITHUB_REPOSITORY -e GITHUB_ACTIONS
          -e PREVIEW_ENVIRONMENT -e PREVIEW_RUN_ID -e PREVIEW_PR -e CLOUDFLARE_ACCOUNT_ID -e CLOUDFLARE_ACCOUNT_NAME
          -e DOPPLER_DEPLOY_PROJECT
          tools sh -ec 'if [ -n "$PREVIEW_RUN_ID" ]; then exec npx tsx scripts/preview-cli.ts destroy; else exec npx tsx scripts/preview-cli.ts destroy --pr "$PREVIEW_PR"; fi'
