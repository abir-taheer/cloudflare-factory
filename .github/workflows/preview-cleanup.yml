name: Preview cleanup
on:
  workflow_run:
    workflows: [Preview cleanup request]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Internal PR preview to destroy
        required: true
        type: number
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: cloudflare-preview-lifecycle
  cancel-in-progress: false
jobs:
  cleanup:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: docker compose build tools
      - name: Destroy owned resources and verify absence
        env:
          DOPPLER_DEPLOY_TOKEN: ${{ secrets.DOPPLER_DEPLOY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: "true"
          DEPLOYMENT_ENVIRONMENT: cloudflare-preview
          RUN_ID: ${{ github.event.workflow_run.id }}
          PULL_REQUEST_NUMBER: ${{ inputs.pr }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_NAME: ${{ secrets.CLOUDFLARE_ACCOUNT_NAME }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
          DOMAIN_SUFFIX: ${{ vars.DOMAIN_SUFFIX }}
          DOPPLER_DEPLOY_PROJECT: ${{ secrets.DOPPLER_DEPLOY_PROJECT }}
        run: >-
          docker compose run --rm --no-deps
          -e DOPPLER_DEPLOY_TOKEN -e GITHUB_TOKEN -e GITHUB_REPOSITORY -e GITHUB_ACTIONS
          -e DEPLOYMENT_ENVIRONMENT -e RUN_ID -e PULL_REQUEST_NUMBER -e CLOUDFLARE_ACCOUNT_ID -e CLOUDFLARE_ACCOUNT_NAME -e CLOUDFLARE_ZONE_ID -e CLOUDFLARE_ZONE_NAME -e DOMAIN_SUFFIX
          -e DOPPLER_DEPLOY_PROJECT
          tools sh -ec 'if [ -n "$RUN_ID" ]; then exec npx tsx scripts/preview/preview-cli.ts destroy; else exec npx tsx scripts/preview/preview-cli.ts destroy --pr "$PULL_REQUEST_NUMBER"; fi'
      - name: Cleanup PostgreSQL branches after Cloudflare resources
        if: always()
        uses: ./.github/actions/cleanup-preview-database
        env:
          DOPPLER_DEPLOY_TOKEN: ${{ secrets.DOPPLER_DEPLOY_TOKEN }}
          DOPPLER_DEPLOY_PROJECT: ${{ secrets.DOPPLER_DEPLOY_PROJECT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_NAME: ${{ secrets.CLOUDFLARE_ACCOUNT_NAME }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
          DOMAIN_SUFFIX: ${{ vars.DOMAIN_SUFFIX }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID: ${{ secrets.NEON_PARENT_BRANCH_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: "true"
          DEPLOYMENT_ENVIRONMENT: cloudflare-preview
