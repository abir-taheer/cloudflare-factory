name: Preview deploy
on:
  workflow_run:
    workflows: [Preview build]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write
# All mutations serialize; the R2 conditional lock also excludes local Docker runs.
concurrency:
  group: cloudflare-preview-lifecycle
  queue: max
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-preview
    steps:
      # workflow_run uses the default branch. Never check out the PR here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build trusted deployment tooling
        run: docker compose build tools
      - name: Mark PR preview pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          docker compose run --rm --no-deps
          -e GITHUB_TOKEN -e GITHUB_EVENT_NAME -e GITHUB_REF
          -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e RUN_ID
          tools npx tsx scripts/preview/github/preview_status_cli.ts pending
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-bundle
          path: preview-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Fork EMPTY preview database
        id: database
        uses: ./.github/actions/provision-preview-database
        with:
          output-file: ${{ runner.temp }}/database-handoff/handoff.json
        env:
          DOPPLER_DEPLOY_TOKEN: ${{ secrets.DOPPLER_DEPLOY_TOKEN }}
          DOPPLER_DEPLOY_PROJECT: ${{ secrets.DOPPLER_DEPLOY_PROJECT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_NAME: ${{ secrets.CLOUDFLARE_ACCOUNT_NAME }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
          DOMAIN_SUFFIX: ${{ vars.DOMAIN_SUFFIX }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID: ${{ secrets.NEON_PARENT_BRANCH_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: "true"
          DEPLOYMENT_ENVIRONMENT: cloudflare-preview
          RUN_ID: ${{ github.event.workflow_run.id }}
      - name: Provision, deploy, and verify
        id: preview
        env:
          DOPPLER_API_TOKEN: ${{ secrets.DOPPLER_API_TOKEN }}
          DOPPLER_API_PROJECT: ${{ secrets.DOPPLER_API_PROJECT }}
          DOPPLER_FRONTEND_TOKEN: ${{ secrets.DOPPLER_FRONTEND_TOKEN }}
          DOPPLER_FRONTEND_PROJECT: ${{ secrets.DOPPLER_FRONTEND_PROJECT }}
          DOPPLER_WORKFLOWS_TOKEN: ${{ secrets.DOPPLER_WORKFLOWS_TOKEN }}
          DOPPLER_WORKFLOWS_PROJECT: ${{ secrets.DOPPLER_WORKFLOWS_PROJECT }}
          DOPPLER_DEPLOY_TOKEN: ${{ secrets.DOPPLER_DEPLOY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: "true"
          DEPLOYMENT_ENVIRONMENT: cloudflare-preview
          RUN_ID: ${{ github.event.workflow_run.id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_NAME: ${{ secrets.CLOUDFLARE_ACCOUNT_NAME }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
          DOMAIN_SUFFIX: ${{ vars.DOMAIN_SUFFIX }}
          DOPPLER_DEPLOY_PROJECT: ${{ secrets.DOPPLER_DEPLOY_PROJECT }}
        run: >-
          docker compose run --rm --no-deps
          --user "$(id -u):$(id -g)" -e HOME=/tmp
          -e DOPPLER_API_TOKEN -e DOPPLER_API_PROJECT
          -e DOPPLER_FRONTEND_TOKEN -e DOPPLER_FRONTEND_PROJECT
          -e DOPPLER_WORKFLOWS_TOKEN -e DOPPLER_WORKFLOWS_PROJECT
          -e DOPPLER_DEPLOY_TOKEN -e GITHUB_TOKEN -e GITHUB_REPOSITORY -e GITHUB_ACTIONS
          -e DEPLOYMENT_ENVIRONMENT -e RUN_ID -e CLOUDFLARE_ACCOUNT_ID -e CLOUDFLARE_ACCOUNT_NAME -e CLOUDFLARE_ZONE_ID -e CLOUDFLARE_ZONE_NAME -e DOMAIN_SUFFIX
          -e DOPPLER_DEPLOY_PROJECT
          -v "${{ runner.temp }}/database-handoff:/database-output:ro"
          -v "$GITHUB_STEP_SUMMARY:/preview-summary" -e GITHUB_STEP_SUMMARY=/preview-summary
          -e DATABASE_OUTPUT_FILE=/database-output/handoff.json
          browser-tests npx tsx scripts/preview/preview_cli.ts deploy
      - name: Publish PR preview result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          STATUS_STATE: ${{ steps.preview.outcome == 'success' && 'success' || 'failure' }}
        run: >-
          docker compose run --rm --no-deps
          -e GITHUB_TOKEN -e GITHUB_EVENT_NAME -e GITHUB_REF
          -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e RUN_ID
          tools npx tsx scripts/preview/github/preview_status_cli.ts "$STATUS_STATE"
      - name: Remove private database handoff
        if: always()
        run: rm -f "${{ runner.temp }}/database-handoff/handoff.json"
