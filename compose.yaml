name: cloudflare-factory
x-app: &app
  build: .
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  volumes:
    - ./apps:/workspace/apps:ro
    - ./packages:/workspace/packages:ro
    - ./tests:/workspace/tests:ro
    - ./scripts:/workspace/scripts:ro
  environment: &environment
    ENVIRONMENT: dev
    TEMPORAL_NAMESPACE: default
    TEMPORAL_TASK_QUEUE: factory-jobs
    PLATFORM_NAMESPACE: factory
    DATABASE_URL: postgres://factory:local-development-only@postgres:5432/factory
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY_ID: local-development
    S3_SECRET_ACCESS_KEY: local-development-only
    S3_BUCKET: factory
    SMTP_HOST: mailpit
    SMTP_PORT: '1025'
    TEMPORAL_ADDRESS: temporal:7233
    API_TOKEN: local-development-only
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio-setup: {condition: service_completed_successfully}
    temporal: {condition: service_healthy}
services:
  browser-tests:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [tools]
    init: true
    working_dir: /workspace
    volumes: [".:/workspace:ro"]
    environment:
      BASE_URL: http://frontend:5173
      TEST_API_TOKEN: local-development-only
    command: [npx, playwright, test]
    depends_on: [frontend, workflows]
  executor:
    build: .
    init: true
    command: [node, --import, tsx, apps/executor/src/node-executor.ts]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    networks: [sandbox]
    environment:
      ENVIRONMENT: dev
      EXECUTOR_TOKEN: local-executor-development-only
  temporal-init:
    image: temporalio/temporal:1.4.1
    user: root
    entrypoint: [/bin/sh, -ec]
    command: ["chown temporal:temporal /data"]
    volumes: [temporal-data:/data]
  api:
    <<: *app
    command: [npx, tsx, watch, apps/api/src/node-api.ts]
    ports: ['127.0.0.1:8787:8787']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8787/healthz').then(r=>process.exit(r.ok?0:1))"]
      interval: 3s
      timeout: 3s
      retries: 30
  frontend:
    <<: *app
    command: [npx, tsx, watch, apps/frontend/src/node-frontend.ts]
    ports: ['127.0.0.1:${FRONTEND_PORT:-5174}:5173']
    environment:
      ENVIRONMENT: dev
      API_URL: http://api:8787
      PORT: '5173'
    depends_on:
      api: {condition: service_healthy}
  workflows:
    <<: *app
    command: [npx, tsx, apps/workflows/src/node-workflows.ts]
  tools:
    <<: *app
    networks: [default, sandbox]
    profiles: [tools]
    user: root
    volumes: ['.:/workspace', 'dependencies:/workspace/node_modules']
    depends_on: {}
    command: [npm, run, check]
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: factory
    volumes: ['postgres-data:/var/lib/postgresql/data', './infra/postgres.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro']
    healthcheck:
      test: [CMD-SHELL, pg_isready -U factory]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.2.1-bookworm
    command: [redis-server, --appendonly, 'yes']
    volumes: ['redis-data:/data']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: local-development
      MINIO_ROOT_PASSWORD: local-development-only
    volumes: ['object-data:/data']
  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    entrypoint: [/bin/sh, -ec]
    command: ['until mc alias set local http://minio:9000 local-development local-development-only; do sleep 1; done; mc mb --ignore-existing local/factory']
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ['127.0.0.1:8025:8025']
  temporal:
    image: temporalio/temporal:1.4.1
    depends_on:
      temporal-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, localhost:7233]
      interval: 3s
      timeout: 3s
      retries: 40
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db
    volumes: ['temporal-data:/data']
volumes:
  dependencies:
  postgres-data:
  redis-data:
  object-data:
  temporal-data:

networks:
  sandbox:
    internal: true
